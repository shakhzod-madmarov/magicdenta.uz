<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta
      http-equiv="Cache-Control"
      content="no-store, no-cache, must-revalidate, max-age=0"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Magic Denta — Queue Display</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/queue-display.css?v=1.1.1" />
  </head>
  <body class="tv-body">
    <div class="tv-app">
      <audio id="queueAudio" preload="auto" playsinline>
        <source src="/sounds/airport-call.mp3" type="audio/mpeg" />
      </audio>
      <div id="unlockBar" class="unlock-bar">
        <div class="unlock-card">
          <div class="unlock-title">TV uchun ovoz yoqilmagan</div>
          <div class="unlock-subtitle">
            Bir marta bosing — ovoz va fullscreen ishga tushadi
          </div>
          <button id="unlockBtn" class="primary-btn" type="button">
            Ovoz / Fullscreen yoqish
          </button>
        </div>
      </div>
      <header class="topbar">
        <div class="brand">
          <img src="/logo.png" alt="Magic Denta" class="brand-logo" />
        </div>
        <div class="topbar-right">
          <div id="headerTime" class="header-time">—</div>
        </div>
      </header>
      <main class="board">
        <div class="table-head">
          <div class="col doctor-col">Shifokor</div>
          <div class="col current-col">Qabulda</div>
          <div class="col next-col">Keyingi</div>
        </div>
        <div id="rows" class="rows">
          <div class="empty-card">Yuklanmoqda...</div>
        </div>
        <div id="pager" class="pager"></div>
      </main>
      <div id="errorBanner" class="error-banner"></div>
      <div id="popupOverlay" class="popup-overlay">
        <div class="popup-card">
          <div class="popup-label">KEYINGI BEMOR</div>
          <div id="popupQueueNo" class="popup-queue-no">#—</div>
          <div id="popupPatientName" class="popup-patient-name">—</div>
          <div class="popup-message">
            Iltimos,
            <span id="popupDentistName" class="popup-dentist-name">—</span>
            huzuriga o‘ting
          </div>
        </div>
      </div>
    </div>
    <script src="/queue-display.js?v=1.1.1"></script>
  </body>
</html>
