# Nginx configuration for Magic Denta
# Client site: magicdenta.uz
# Admin site:  admin-magicdenta.uz (and admin.magicdenta.uz)
# API service: api.magicdenta.uz

# 1. Patient / Public Site
server {
  listen 80;
  server_name magicdenta.uz www.magicdenta.uz;

  root /var/www/magicdenta/front-denta/dist;
  index index.html;
  client_max_body_size 512m;

  location = /queue-display {
      add_header Cache-Control "no-store";
      try_files /queue-display.html =404;
  }

  location = /queue-display/ {
      return 301 /queue-display;
  }

  location = /queue-display.html {
      add_header Cache-Control "no-store";
  }

  location = /queue-display.css {
      add_header Cache-Control "no-store";
  }

  location = /queue-display.js {
      add_header Cache-Control "no-store";
  }

  location = /__queue_feed {
      proxy_pass http://127.0.0.1:5000/api/public/queue;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_set_header x-screen-key "Magic_Denta_Screen_2026";

      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;

      add_header Cache-Control "no-store";
  }

  location /uploads {
      proxy_pass http://127.0.0.1:5000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

# 2. Admin & Dentist Portal
server {
  listen 80;
  server_name admin-magicdenta.uz www.admin-magicdenta.uz admin.magicdenta.uz www.admin.magicdenta.uz;

  root /var/www/magicdenta/admin/dist;
  index index.html;
  client_max_body_size 512m;

  location /uploads {
      proxy_pass http://127.0.0.1:5000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

# 3. Backend API Gateway
server {
  listen 80;
  server_name api.magicdenta.uz;

  client_max_body_size 512m;

  location = /queue-display {
      add_header Cache-Control "no-store";
      try_files /queue-display.html =404;
  }

  location = /queue-display/ {
      return 301 /queue-display;
  }

  location = /queue-display.html {
      add_header Cache-Control "no-store";
  }

  location = /queue-display.css {
      add_header Cache-Control "no-store";
  }

  location = /queue-display.js {
      add_header Cache-Control "no-store";
  }

  location = /__queue_feed {
      proxy_pass http://127.0.0.1:5000/api/public/queue;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_set_header x-screen-key "Magic_Denta_Screen_2026";

      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;

      add_header Cache-Control "no-store";
  }

  location / {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
